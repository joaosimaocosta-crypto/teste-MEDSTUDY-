# MEDSTUDY MOZ — verificação automática em cada push e pull request.
# Usa SEMPRE um Supabase local (Docker no próprio runner) — nunca o projecto de produção.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Supabase local (migrações + seed)
        run: npx supabase start -x realtime,storage-api,imgproxy,edge-runtime,logflare,vector,supavisor,studio,postgres-meta

      - name: Base de dados — lint e testes de segurança (pgTAP)
        run: |
          npm run db:lint
          npm run db:test

      - name: Criar .env.local com as chaves LOCAIS
        run: |
          eval "$(npx supabase status -o env | grep -E '^(API_URL|PUBLISHABLE_KEY|SECRET_KEY)=')"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
            echo "SUPABASE_SECRET_KEY=$SECRET_KEY"
            echo "NEXT_PUBLIC_SITE_URL=http://localhost:3000"
          } > .env.local

      - name: Build
        run: npm run build

      - name: Tipos (TypeScript)
        run: npm run typecheck

      - name: A chave secreta não pode estar no código do browser
        run: |
          SECRET=$(grep SUPABASE_SECRET_KEY .env.local | cut -d= -f2)
          if grep -rq "$SECRET" .next/static; then echo "Chave secreta encontrada no bundle do cliente!"; exit 1; fi

      - name: Browsers do Playwright
        run: npx playwright install --with-deps chromium

      - name: Testes de ponta a ponta e acessibilidade
        run: npm run test:e2e

      - name: Guardar capturas de ecrã e relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: tests/e2e/.artifacts
          retention-days: 7
